[package]
name = "s-wind-sim"
version = "0.1.0"
edition = "2021"
description = "S-wind: Complete Exact Algebraic Simulation - EPR (Infinite Precision)"
license-file = "LICENSE.md"

[lib]
name = "s_wind"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rayon = "1.10"

# Voyager for pattern detection
voyager = { path = "vendor/voyager" }

# Examples
[[example]]
name = "knowledge_demo"
path = "examples/knowledge_demo.rs"

# Core Binaries
[[bin]]
name = "swind"
path = "src/bin/swind.rs"

